<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6b4226">
  <meta name="robots" content="noindex">
  <title>내 계정 — HAYZ</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64.png">
  <link rel="stylesheet" href="/css/style.css?v=signup1">
</head>
<body class="acct-page">
  <header class="nav">
    <a class="logo" href="/"><span class="logo-mark"></span>HAYZ</a>
    <nav>
      <a href="/">홈</a>
      <a class="btn btn-sm" href="/#download">앱 다운로드</a>
    </nav>
  </header>

  <main class="acct">
    <p class="acct-loading" id="acctLoading">불러오는 중…</p>
    <section class="acct-card" id="acctCard" hidden>
      <p class="acct-welcome" id="acctWelcome" hidden>가입을 환영합니다!</p>
      <div class="acct-head">
        <span class="acct-avatar" id="acctAvatar" aria-hidden="true"></span>
        <div>
          <h1 id="acctName"></h1>
          <p class="acct-mail" id="acctEmail"></p>
        </div>
      </div>
      <dl class="acct-info">
        <dt>가입일</dt><dd id="acctSince"></dd>
        <dt>로그인 방식</dt><dd>Google 계정</dd>
      </dl>
      <form class="acct-form" id="acctForm">
        <label for="acctOffice">사무실 이름</label>
        <div class="acct-row">
          <input id="acctOffice" maxlength="40" placeholder="예: 김예시 설계사무소" autocomplete="organization">
          <button class="btn btn-sm" type="submit">저장</button>
        </div>
        <p class="acct-hint" id="acctSaved" hidden>저장했습니다.</p>
      </form>
      <div class="acct-next">
        <h2>다음 단계</h2>
        <p>웹 버전은 준비 중입니다. 지금은 데스크탑 앱을 받아 바로 시작할 수 있습니다.</p>
        <a class="btn" href="/#download">데스크탑 앱 받기</a>
      </div>
      <div class="acct-actions">
        <button type="button" class="acct-link" id="acctLogout">로그아웃</button>
        <button type="button" class="acct-link acct-danger" id="acctDelete">회원 탈퇴</button>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="logo"><span class="logo-mark"></span>HAYZ</div>
    <a class="footer-mail" href="mailto:hi@ha-y.day">문의 hi@ha-y.day</a>
  </footer>
  <script src="/js/account.js?v=signup1"></script>
</body>
</html>
