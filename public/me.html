<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>내 정보 — HAYZ</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <a class="skip" href="#content">본문으로 건너뛰기</a>
  <header class="nav" data-nav>
    <div class="nav-inner">
      <a class="logo" href="/"><img class="logo-mark" src="/assets/logo-placeholder.svg" width="28" height="28" alt=""><span>HAYZ</span></a>
      <button type="button" class="nav-toggle" data-nav-toggle aria-expanded="false" aria-controls="site-nav">
        <span class="visually-hidden">메뉴</span>
        <span data-icon="menu"></span>
      </button>
      <nav id="site-nav" aria-label="주요">
        <a href="/">홈</a>
        <a href="/pricing">요금</a>
        <a href="/faq">FAQ</a>
        <a class="btn btn-sm" href="/me" data-me hidden>내 정보</a>
        <a class="btn btn-sm" href="/admin" data-admin hidden>관리</a>
        <a class="btn btn-sm" href="/auth/google/start" data-login>로그인</a>
      </nav>
    </div>
  </header>
  <main id="content" class="section">
    <div class="wrap prose">
      <h1>내 정보</h1>
      <img class="avatar" id="me-photo" alt="" referrerpolicy="no-referrer" hidden>
      <dl class="meta">
        <dt>이름</dt><dd id="me-name"></dd>
        <dt>이메일</dt><dd id="me-email"></dd>
        <dt>가입일</dt><dd id="me-created"></dd>
        <dt>마지막 로그인</dt><dd id="me-login"></dd>
        <dt>상태</dt><dd id="me-status"></dd>
        <dt>약관 동의</dt><dd id="me-consent"></dd>
      </dl>
      <button class="btn" type="button" id="logout"><span data-icon="logout"></span>로그아웃</button>
      <section class="danger-zone">
        <h2>회원 탈퇴</h2>
        <p>탈퇴하면 계정이 비활성화되고 이메일, 이름, 사진, 구글 식별자가 삭제됩니다. 복구할 수 없습니다. 본인 확인을 위해 가입 이메일을 입력하세요.</p>
        <form id="withdraw-form" class="stack">
          <label class="field">이메일
            <input type="email" name="confirmEmail" required autocomplete="off" maxlength="320">
          </label>
          <label class="check">
            <input type="checkbox" name="understand" required>
            <span>개인정보가 삭제되고 되돌릴 수 없음을 이해합니다.</span>
          </label>
          <button class="btn btn-danger" type="submit">탈퇴하기</button>
        </form>
        <p class="form-error" id="form-error" role="alert" hidden></p>
      </section>
    </div>
  </main>
  <script type="module" src="/js/me.js"></script>
</body>
</html>
