<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>가입 동의 — HAYZ</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <a class="skip" href="#content">본문으로 건너뛰기</a>
  <header class="nav" data-nav>
    <div class="nav-inner">
      <a class="logo" href="/"><img class="logo-mark" src="/assets/logo-placeholder.svg" width="28" height="28" alt=""><span>HAYZ</span></a>
      <a class="btn btn-sm" href="/">홈</a>
    </div>
  </header>
  <main id="content" class="section">
    <div class="wrap prose">
      <h1>가입 동의</h1>
      <p>구글 로그인은 확인되었습니다. 아래 문서에 동의해야 가입이 완료되고 회원이 만들어집니다.</p>
      <p id="pending-who"></p>
      <form id="consent-form" class="stack">
        <label class="check" for="agree-terms">
          <input id="agree-terms" type="checkbox" name="agreeTerms" required>
          <span>이용약관(버전 __TERMS_VERSION__)에 동의합니다.</span>
        </label>
        <p><a href="/legal/terms">이용약관 본문 보기</a></p>
        <label class="check" for="agree-privacy">
          <input id="agree-privacy" type="checkbox" name="agreePrivacy" required>
          <span>개인정보 처리방침(버전 __PRIVACY_VERSION__)에 동의합니다.</span>
        </label>
        <p><a href="/legal/privacy">개인정보 처리방침 본문 보기</a></p>
        <button class="btn" type="submit">동의하고 가입하기</button>
        <p class="form-error" id="form-error" role="alert" hidden></p>
      </form>
    </div>
  </main>
  <script type="module" src="/js/consent.js"></script>
</body>
</html>
